name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l core)"
      - name: Test
        run: ./scripts/test-core.sh
      - name: Cross-compile
        working-directory: core
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/testvpn
          done
          GOOS=android GOARCH=arm64 go vet ./bridge

  ios:
    name: iOS app (unsigned build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Vpncore.xcframework
        run: ./scripts/build-xcframework.sh
      - name: Generate project
        working-directory: apple
        run: xcodegen generate
      - name: Build
        working-directory: apple
        run: >
          xcodebuild -project VPN.xcodeproj -scheme VPNApp
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
