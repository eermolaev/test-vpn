name: VPN
options:
  bundleIdPrefix: com.example.testvpn
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  VPNApp:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: App
        excludes: ["*.plist", "*.entitlements"]
      - Shared
    dependencies:
      - target: PacketTunnel_${platform}
        embed: true
        codeSign: true
      - framework: Frameworks/Vpncore.xcframework
        embed: false
      # Go's net package resolves DNS through libresolv on Darwin.
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: VPN
        CODE_SIGN_ENTITLEMENTS: App/App-${platform}.entitlements
        INFOPLIST_FILE: App/Info-${platform}.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  PacketTunnel:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - path: PacketTunnel
        excludes: ["*.plist", "*.entitlements"]
      - Shared
    dependencies:
      - framework: Frameworks/Vpncore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNNEL_BUNDLE_ID)
        PRODUCT_NAME: PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel-${platform}.entitlements
        INFOPLIST_FILE: PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  VPNApp_iOS:
    build:
      targets:
        VPNApp_iOS: all
  VPNApp_macOS:
    build:
      targets:
        VPNApp_macOS: all
